version: "3.9"

services:
  brawl-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: brawl-api
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  caddy:
    image: caddy:2
    container_name: brawl-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - brawl-api

volumes:
  caddy_data:
  caddy_config:
